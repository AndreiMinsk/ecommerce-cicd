name: Notification Service CI

on:
  push:
    branches: [main]
    paths:
      - 'notification-service/**'
      - '.github/workflows/notification-service.yml'
      - '.github/workflows/_build-and-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'notification-service/**'
jobs:
  ci:
    uses: ./.github/workflows/_build-and-deploy.yml
    with:
      service: notification-service
    secrets: inherit