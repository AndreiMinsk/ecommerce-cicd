name: Eureka Server CI

on:
  push:
    branches: [main]
    paths:
      - 'eureka-server/**'
      - '.github/workflows/eureka-server.yml'
      - '.github/workflows/_build-and-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'eureka-server/**'
jobs:
  ci:
    uses: ./.github/workflows/_build-and-deploy.yml
    with:
      service: eureka-server
    secrets: inherit