name: Build and Deploy

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - run: mvn -B clean verify
        working-directory: ${{inputs.service}}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-${{ inputs.service }}
          path: ${{inputs.service}}/target/site/jacoco/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: 465
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ CI failed: ${{ inputs.service }}"
          to: ${{ secrets.SMTP_TO }}
          from: GitHub Actions
          body: |
            Workflow failed for ${{ inputs.service }}
            Commit: ${{ github.sha }}
            See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}





