productService:
  image: andreimensk/product-service
  replicas: 1
  dbUrl: "jdbc:postgresql://ecommerce-product-db:5432/postgres"
  EUREKA_URL: "http://eureka-server:8761/eureka/"
  tag: latest
orderService:
  image: andreimensk/order-service
  replicas: 1
  DB_URL: "jdbc:postgresql://ecommerce-order-db:5432/postgres"
  EUREKA_URL: "http://eureka-server:8761/eureka/"
  tag: latest
product-db:
  image:
    repository: bitnamilegacy/postgresql
  auth:
    existingSecret: product-db-secret
    secretKeys:
      adminPasswordKey: POSTGRES_PASSWORD
  primary:
    persistence:
      enabled: true
      size: 100Mi
order-db:
  image:
    repository: bitnamilegacy/postgresql
  auth:
    existingSecret: order-db-secret
    secretKeys:
      adminPasswordKey: POSTGRES_PASSWORD
  primary:
    persistence:
      enabled: true
      size: 100Mi