services:
  product-service:
    build:
      context: .
      dockerfile: ./product-service/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - product-db
      - eureka
  order-service:
    build:
      context: .
      dockerfile: ./order-service/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - order-db
      - eureka
  product-db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - product_data:/var/lib/postgresql
  order-db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - order_data:/var/lib/postgresql
  eureka:
    build:
      context: .
      dockerfile: ./eureka-server/Dockerfile
    ports:
      - "8761:8761"

volumes:
  product_data:
  order_data:

