server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://product-db:5432/postgres}
    password: ${DB_PASSWORD:password}
    username: ${DB_USERNAME:postgres}
  jpa:
    hibernate:
      ddl-auto: update
  application:
    name: product-service
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}
management:
  endpoint:
    health:
      probes:
        enabled: true
logging:
  file:
    path: /app/logs
