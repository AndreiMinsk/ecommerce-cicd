server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://product-db:5432/postgres}
    password: password
    username: postgres
  jpa:
    hibernate:
      ddl-auto: update
  application:
    name: product-service
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}
