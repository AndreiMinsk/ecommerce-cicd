spring:
  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: my-consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "app.dto"
  mail:
    host: smtp.gmail.com
    port: 587
    username: hinatalondon@gmail.com
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
logfile: ${LOG_FILE}
server:
  port: 8082
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:8761/eureka/}
